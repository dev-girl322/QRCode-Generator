<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCode Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <input type="text" placeholder="Enter the URL">
        <div class="qrcode-container">
            <!-- <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=exampletext" alt="Loading..."> -->
        </div>
        <div class="btns">
            <button class="btn generate"
                onclick="document.querySelector('.qrcode-container').classList.toggle('animate')">Generate</button>
            <button class="btn dwnld">Download</button>
        </div>
    </div>
</body>

</html>
